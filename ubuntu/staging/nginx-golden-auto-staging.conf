# staging.mygoldenauto.net:4343 → /srv/golden-auto-staging (branch staging). Same layout as production's site,
# with its own certificate, PHP-FPM pool and document root. Not indexed by search engines.
server {
    listen 4343 ssl;
    server_name staging.mygoldenauto.net;
    ssl_certificate /etc/letsencrypt/live/staging.mygoldenauto.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.mygoldenauto.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/golden-auto-staging/public;
    index index.php;
    client_max_body_size 72m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ /\. {
        deny all;
    }
    location /assets/ {
        location ~ \.php {
            deny all;
        }
        try_files $uri =404;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/golden-auto-staging.sock;
        fastcgi_read_timeout 180s;
    }
}
