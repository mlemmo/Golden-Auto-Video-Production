# staging.mygoldenauto.net:4343 → /srv/golden-auto-staging (branch staging), served by the Node service on
# 127.0.0.1:4352 (pages, sign-in, actions); Nginx serves only the static files. Installed by
# ubuntu/staging/setup-node-root.sh in place of the PHP config (nginx-golden-auto-staging.conf). Not indexed.
server {
    listen 4343 ssl;
    server_name staging.mygoldenauto.net;
    ssl_certificate /etc/letsencrypt/live/staging.mygoldenauto.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.mygoldenauto.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/golden-auto-staging/public;
    client_max_body_size 72m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /assets/ {
        location ~ \.php {
            deny all;
        }
        try_files $uri =404;
    }
    location ~ ^/(style\.css|app\.js|narration\.js)$ {
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
    location = /index.php {
        proxy_pass http://127.0.0.1:4352;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 180s;
    }
    location ~ \.php$ {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:4352;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 180s;
    }
}
