# node.mygoldenauto.net:4343 → /srv/golden-auto-node (branch nodejs): the Node.js port test site, served entirely by
# the Node service on 127.0.0.1:4351 (pages, sign-in, actions); Nginx serves only the static files. Not indexed by
# search engines.
server {
    listen 4343 ssl;
    server_name node.mygoldenauto.net;
    ssl_certificate /etc/letsencrypt/live/node.mygoldenauto.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node.mygoldenauto.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/golden-auto-node/public;
    client_max_body_size 72m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Static files (style, scripts, uploaded and generated assets) straight from disk; everything else — the
    # dashboard page, sign-in and every action — is the Node service. PHP is not used by this site any more.
    location /assets/ {
        location ~ \.php {
            deny all;
        }
        try_files $uri =404;
    }
    location ~ ^/(style\.css|app\.js|narration\.js)$ {
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
    location = /index.php {
        proxy_pass http://127.0.0.1:4351;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 180s;
    }
    location ~ \.php$ {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:4351;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 180s;
    }
}
