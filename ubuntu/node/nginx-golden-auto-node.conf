# node.mygoldenauto.net:4343 → /srv/golden-auto-node (branch nodejs): the Node.js port test site. Same layout as
# staging; routes already ported to Node (/api/node/…) go to the Node service on 127.0.0.1:4351, everything else to
# PHP-FPM. Not indexed by search engines.
server {
    listen 4343 ssl;
    server_name node.mygoldenauto.net;
    ssl_certificate /etc/letsencrypt/live/node.mygoldenauto.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node.mygoldenauto.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/golden-auto-node/public;
    index index.php;
    client_max_body_size 72m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /api/node/ {
        proxy_pass http://127.0.0.1:4351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ /\. {
        deny all;
    }
    location /assets/ {
        location ~ \.php {
            deny all;
        }
        try_files $uri =404;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/golden-auto-node.sock;
        fastcgi_read_timeout 180s;
    }
}
