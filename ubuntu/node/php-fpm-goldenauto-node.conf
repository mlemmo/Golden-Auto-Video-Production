; PHP-FPM pool for node.mygoldenauto.net (Node.js port test site): same settings as production's [goldenauto] pool,
; its own socket. PHP keeps serving every page and route that is not ported to Node yet.
[goldenauto-node]
user = mark
group = mark
listen = /run/php/golden-auto-node.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
request_terminate_timeout = 180s
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 72M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
