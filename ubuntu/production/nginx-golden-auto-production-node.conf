# video.mygoldenauto.net:4343 → /srv/golden-auto (branch main, production), served by the Node service on
# 127.0.0.1:4353 (pages, sign-in, actions); Nginx serves only the static files. Installed by
# ubuntu/production/setup-node-root.sh.
server {
    listen 4343 ssl;
    server_name video.mygoldenauto.net;
    ssl_certificate /etc/letsencrypt/live/video.mygoldenauto.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.mygoldenauto.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/golden-auto/public;
    client_max_body_size 72m;
    location /assets/ {
        try_files $uri =404;
    }
    location = /style.css {
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
    location / {
        proxy_pass http://127.0.0.1:4353;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 180s;
    }
}
